<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U1 U2 Đề 3</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #4F46E5;
            --color-secondary: #06B6D4;
            --color-accent: #F59E0B;
            --color-bg: #F8FAFC;
            --color-card: #FFFFFF;
            --color-correct: #22C55E;
            --color-wrong: #EF4444;
            --color-selecting: #2563EB;
            --color-pending: #FEF3C7;
            --color-pending-text: #92400E;
        }

        body {
            font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
            background-color: var(--color-bg);
            background-image: url('data:image/svg+xml,%3Csvg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"%3E%3Cg fill="%234f46e5" fill-opacity="0.03" fill-rule="evenodd"%3E%3Ccircle cx="3" cy="3" r="3"/%3E%3Ccircle cx="13" cy="13" r="3"/%3E%3C/g%3E%3C/svg%3E');
            color: #333;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--color-primary);
        }

        .progress-bar-container {
            width: 100%;
            background-color: #e2e8f0;
            border-radius: 8px;
            height: 10px;
            margin: 10px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--color-primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 15px;
            font-weight: 500;
            color: #64748b;
        }

        .card {
            background: var(--color-card);
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            padding: 24px;
            margin-bottom: 24px;
            transition: transform 0.2s, box-shadow 0.2s;
            overflow-wrap: break-word;
        }

        .question {
            font-size: 21px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .answer-area {
            font-size: 18px;
            font-weight: 500;
        }

        .input-box {
            font-family: inherit;
            font-size: 18px;
            padding: 8px 12px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: all 0.2s;
            min-width: 200px;
        }
        
        .textarea-box {
            font-family: inherit;
            font-size: 18px;
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: all 0.2s;
            width: 100%;
            box-sizing: border-box;
            resize: vertical;
            min-height: 80px;
        }

        .input-box:focus, .textarea-box:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        .input-box.pending, .textarea-box.pending {
            background-color: var(--color-pending);
            color: var(--color-pending-text);
            border-color: var(--color-pending-text);
            transform: scale(1.02);
        }

        .input-box.correct {
            background-color: var(--color-correct);
            color: white;
            border-color: var(--color-correct);
        }

        .input-box.wrong {
            background-color: var(--color-wrong);
            color: white;
            border-color: var(--color-wrong);
            animation: shake 0.15s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .btn-check {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 20px;
            font-size: 17px;
            font-weight: 600;
            color: white;
            background-color: var(--color-primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            min-height: 52px;
            transition: background-color 0.2s, opacity 0.2s;
        }

        .btn-check:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn-check:not(:disabled):hover {
            background-color: #4338ca;
        }

        .explanation {
            margin-top: 20px;
            padding: 16px;
            background-color: #f1f5f9;
            border-left: 4px solid var(--color-primary);
            border-radius: 4px 8px 8px 4px;
            font-size: 17px;
            font-weight: 400;
            line-height: 1.8;
            display: none;
        }

        .submit-area {
            text-align: center;
            margin: 40px 0;
            padding: 20px;
            background: var(--color-card);
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        .btn-submit {
            padding: 16px 32px;
            font-size: 19px;
            font-weight: 700;
            color: white;
            background-color: var(--color-selecting);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            width: 100%;
            max-width: 400px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-submit:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .student-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            max-width: 400px;
            margin: 0 auto 20px auto;
        }
        
        .student-info input {
            padding: 12px;
            font-size: 16px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
        }

        .wrong-list-section {
            margin-top: 40px;
            display: none;
        }

        .wrong-list-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--color-wrong);
            margin-bottom: 20px;
            text-align: center;
        }
        
        .essay-list-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--color-secondary);
            margin-bottom: 20px;
            text-align: center;
            margin-top: 40px;
        }

        .correct-answer-text {
            color: var(--color-correct);
            font-weight: 600;
            margin-left: 8px;
        }

        .user-wrong-text {
            color: var(--color-wrong);
            text-decoration: line-through;
            margin-left: 8px;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .popup {
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .popup h2 {
            margin-top: 0;
            color: var(--color-primary);
        }

        .popup button {
            margin-top: 20px;
            padding: 10px 20px;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            h1 { font-size: 20px; }
            .question { font-size: 20px; }
            .answer-area { font-size: 17px; }
            .btn-check { font-size: 16px; padding: 12px 16px; }
            .explanation { font-size: 16px; }
            .input-box { width: 100%; box-sizing: border-box; margin-top: 8px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>U1 U2 Đề 3</h1>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="progress-text" id="progress-text">Đã làm: 0/0</div>
    </header>

    <div id="quiz-container"></div>

    <div class="submit-area">
        <div class="student-info">
            <input type="text" id="student-name" placeholder="Nhập tên của bạn (Bắt buộc)" required>
        </div>
        <button class="btn-submit" id="btn-submit" disabled>Nộp bài</button>
    </div>

    <div class="wrong-list-section" id="wrong-list-section">
        <h2 class="wrong-list-title" id="wrong-list-title">DANH SÁCH CÁC CÂU LÀM SAI</h2>
        <div id="wrong-list-container"></div>
        
        <h2 class="essay-list-title" id="essay-list-title">Các câu tự luận — hãy tự đối chiếu đáp án mẫu</h2>
        <div id="essay-list-container"></div>
    </div>
</div>

<div class="overlay" id="popup-overlay">
    <div class="popup">
        <h2 id="popup-title">Kết quả</h2>
        <p id="popup-message"></p>
        <button id="popup-close">Đóng & Xem chi tiết</button>
    </div>
</div>

    let userState = {};
    let totalQuestions = quizData.length;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            } catch (e) {}
        }
    }

    function playSound(type) {
        initAudio();
        if (!audioCtx) return;
        try {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            if (type === 'select') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.setValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'submit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(500, now);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            }
        } catch(e) {}
    }

    function escapeHTML(str){
        if (!str) return "";
        const d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
    }

    function normalizeAnswer(str){
        return str.trim().replace(/\s+/g,' ').toLowerCase();
    }

    function updateProgress() {
        let interacted = 0;
        let checkedCount = 0;
        quizData.forEach(q => {
            const st = userState[q.id];
            if (st.checked) {
                interacted++;
                checkedCount++;
                return;
            }
            if (q.type === 'gap_fill_text') {
                const vals = Object.values(st.answer).filter(v => v !== null && v.trim() !== "");
                if (vals.length > 0) interacted++;
            } else if (q.type === 'sentence_rewrite') {
                if (st.answer && st.answer.trim() !== "") interacted++;
            }
        });
        const pct = (interacted / totalQuestions) * 100;
        document.getElementById('progress-bar').style.width = pct + '%';
        document.getElementById('progress-text').textContent = `Đã làm: ${interacted}/${totalQuestions}`;
        
        const nameVal = document.getElementById('student-name').value.trim();
        document.getElementById('btn-submit').disabled = (nameVal === "");
    }

    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';
        
        quizData.forEach(q => {
            if (q.type === 'gap_fill_text') {
                userState[q.id] = { answer: {}, checked: false, isCorrect: null, blankResults: {} };
                q.blanks.forEach(b => {
                    userState[q.id].answer[b.blankId] = null;
                });
            } else if (q.type === 'sentence_rewrite') {
                userState[q.id] = { answer: null, checked: false, isCorrect: null, blankResults: null };
            }
            
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `card-${q.id}`;
            
            let html = `<div class="question">`;
            if (q.type === 'gap_fill_text') {
                let qText = q.questionHTML;
                q.blanks.forEach(b => {
                    qText = qText.replace(`{{blank:${b.blankId}}}`, `<input type="text" class="input-box" data-id="${q.id}" data-blank="${b.blankId}" autocomplete="off">`);
                });
                html += qText;
            } else if (q.type === 'sentence_rewrite') {
                html += q.originalSentenceHTML;
                html += `</div><div class="answer-area"><textarea class="textarea-box" data-id="${q.id}" placeholder="Nhập câu trả lời của bạn..."></textarea></div>`;
            }
            if (q.type === 'gap_fill_text') html += `</div>`;
            
            html += `<button class="btn-check" id="check-btn-${q.id}" disabled>Kiểm tra</button>`;
            html += `<div class="explanation" id="exp-${q.id}">${q.explanationHTML}</div>`;
            
            card.innerHTML = html;
            container.appendChild(card);
        });
        
        document.querySelectorAll('.input-box, .textarea-box').forEach(inp => {
            inp.addEventListener('input', (e) => {
                const qId = parseInt(e.target.getAttribute('data-id'));
                const st = userState[qId];
                if (st.checked) return;
                
                const val = e.target.value;
                if (e.target.classList.contains('input-box')) {
                    const bId = e.target.getAttribute('data-blank');
                    st.answer[bId] = val;
                } else {
                    st.answer = val;
                }
                
                if (val.trim() !== "") {
                    e.target.classList.add('pending');
                } else {
                    e.target.classList.remove('pending');
                }
                
                checkEnableCheckBtn(qId);
                updateProgress();
            });
            
            inp.addEventListener('blur', (e) => {
                const val = e.target.value;
                if (val.trim() !== "" && !userState[parseInt(e.target.getAttribute('data-id'))].checked) {
                    playSound('select');
                }
            });
        });
        
        document.querySelectorAll('.btn-check').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const qId = parseInt(e.target.id.replace('check-btn-', ''));
                handleCheck(qId);
            });
        });
    }

    function checkEnableCheckBtn(qId) {
        const q = quizData.find(x => x.id === qId);
        const st = userState[qId];
        let hasInput = false;
        if (q.type === 'gap_fill_text') {
            hasInput = Object.values(st.answer).some(v => v !== null && v.trim() !== "");
        } else if (q.type === 'sentence_rewrite') {
            hasInput = st.answer !== null && st.answer.trim() !== "";
        }
        document.getElementById(`check-btn-${qId}`).disabled = !hasInput;
    }

    function handleCheck(qId, fromSubmit = false) {
        const q = quizData.find(x => x.id === qId);
        const st = userState[qId];
        if (st.checked) return;
        
        if (!fromSubmit) {
            let canCheck = true;
            if (q.type === 'gap_fill_text') {
                canCheck = q.blanks.every(b => st.answer[b.blankId] !== null && st.answer[b.blankId].trim() !== "");
            } else if (q.type === 'sentence_rewrite') {
                canCheck = st.answer !== null && st.answer.trim() !== "";
            }
            if (!canCheck) {
                alert("Vui lòng điền đủ chỗ trống trước khi kiểm tra!");
                return;
            }
        }
        
        st.checked = true;
        const card = document.getElementById(`card-${qId}`);
        const inputs = card.querySelectorAll('.input-box, .textarea-box');
        inputs.forEach(inp => {
            inp.disabled = true;
            inp.classList.remove('pending');
        });
        document.getElementById(`check-btn-${qId}`).disabled = true;
        
        if (q.type === 'sentence_rewrite') {
            st.isCorrect = null;
            if (!fromSubmit) {
                document.getElementById(`exp-${qId}`).style.display = 'block';
            }
            return;
        }
        
        if (q.type === 'gap_fill_text') {
            let allCorrect = true;
            q.blanks.forEach(b => {
                const userAns = st.answer[b.blankId] ? normalizeAnswer(st.answer[b.blankId]) : "";
                const isC = b.correctAnswers.some(ca => normalizeAnswer(ca) === userAns);
                st.blankResults[b.blankId] = isC;
                if (!isC) allCorrect = false;
                
                const inp = card.querySelector(`input[data-blank="${b.blankId}"]`);
                if (isC) {
                    inp.classList.add('correct');
                } else {
                    inp.classList.add('wrong');
                    const correctSpan = document.createElement('span');
                    correctSpan.className = 'correct-answer-text';
                    correctSpan.textContent = ` (${b.correctAnswers[0]})`;
                    inp.parentNode.insertBefore(correctSpan, inp.nextSibling);
                }
            });
            st.isCorrect = allCorrect;
            if (!fromSubmit) {
                if (allCorrect) playSound('correct');
                else playSound('wrong');
                document.getElementById(`exp-${qId}`).style.display = 'block';
            }
        }
    }

    document.getElementById('student-name').addEventListener('input', updateProgress);

    document.getElementById('btn-submit').addEventListener('click', () => {
        let name = document.getElementById('student-name').value.trim();
        if (!name) {
            alert("Vui lòng nhập tên!");
            return;
        }
        
        quizData.forEach(q => {
            if (!userState[q.id].checked) {
                handleCheck(q.id, true);
                if (q.type !== 'sentence_rewrite') {
                    if (userState[q.id].isCorrect === null) userState[q.id].isCorrect = false;
                }
            }
        });
        
        let gradable = 0;
        let correct = 0;
        let wrongDetails = [];
        
        quizData.forEach(q => {
            const st = userState[q.id];
            if (st.isCorrect !== null) {
                gradable++;
                if (st.isCorrect) correct++;
                else {
                    let userStr = "";
                    let correctStr = "";
                    if (q.type === 'gap_fill_text') {
                        userStr = Object.values(st.answer).map(v => v || "trống").join(", ");
                        correctStr = q.blanks.map(b => b.correctAnswers[0]).join(", ");
                    }
                    wrongDetails.push(`Câu ${q.id}: Học sinh chọn "${userStr}" (sai), đáp án đúng là "${correctStr}"`);
                }
            }
        });
        
        if (gradable > 0) {
            playSound('submit');
            if (correct === gradable) setTimeout(() => playSound('correct'), 500);
        } else {
            playSound('submit');
        }
        
        const scoreStr = gradable > 0 ? `${correct}/${gradable}` : "Không có câu trắc nghiệm";
        
        const formData = new URLSearchParams();
        formData.append("entry.1861648410", name);
        formData.append("entry.1691800437", scoreStr);
        formData.append("entry.639295732", wrongDetails.join("\n"));
        formData.append("entry.370465671", "U1 U2 Đề 3");
        
        fetch("https://docs.google.com/forms/d/e/1FAIpQLSfZCAK2lpNE8O8Ieqwc3SI1ubr6HZDvGZR91AsSpUk8kEBqaA/formResponse", {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: formData.toString()
        }).then(() => {
            showPopup(gradable > 0 ? `Điểm của bạn: ${scoreStr}` : "Bài này không có câu được chấm tự động.", wrongDetails.length > 0 ? "Bạn cần ôn tập thêm nhé!" : "Tuyệt vời, đúng hết rồi!");
        }).catch(err => {
            showPopup("Đã lưu kết quả cục bộ", "Lỗi gửi điểm (bỏ qua nếu đang làm offline).");
        });
        
        document.getElementById('btn-submit').disabled = true;
        renderWrongList();
    });

    function showPopup(title, msg) {
        document.getElementById('popup-title').textContent = title;
        document.getElementById('popup-message').textContent = msg;
        document.getElementById('popup-overlay').style.display = 'flex';
    }

    document.getElementById('popup-close').addEventListener('click', () => {
        document.getElementById('popup-overlay').style.display = 'none';
        const wls = document.getElementById('wrong-list-section');
        wls.style.display = 'block';
        wls.scrollIntoView({ behavior: 'smooth' });
    });

    function renderWrongList() {
        const wlc = document.getElementById('wrong-list-container');
        const elc = document.getElementById('essay-list-container');
        wlc.innerHTML = '';
        elc.innerHTML = '';
        
        let allCorrectGradable = true;
        let hasGradable = false;
        
        quizData.forEach(q => {
            const st = userState[q.id];
            if (st.isCorrect !== null) {
                hasGradable = true;
                if (!st.isCorrect) allCorrectGradable = false;
            }
            
            if (st.isCorrect === false) {
                const c = document.createElement('div');
                c.className = 'card';
                let html = `<strong>Câu ${q.id}:</strong> ${q.questionHTML}<br><br>`;
                if (q.type === 'gap_fill_text') {
                    q.blanks.forEach(b => {
                        const uA = st.answer[b.blankId] || "(Bạn chưa điền)";
                        if (!st.blankResults[b.blankId]) {
                            html += `<span>Bạn điền: <span class="user-wrong-text">${escapeHTML(uA)}</span></span><br>`;
                            html += `<span>Đáp án đúng: <span class="correct-answer-text">${escapeHTML(b.correctAnswers[0])}</span></span><br><br>`;
                        } else {
                            html += `<span>Chỗ trống ${b.blankId}: <span class="correct-answer-text">${escapeHTML(uA)}</span></span><br><br>`;
                        }
                    });
                }
                html += `<div class="explanation" style="display:block;">${q.explanationHTML}</div>`;
                c.innerHTML = html;
                wlc.appendChild(c);
            } else if (st.isCorrect === null) {
                const c = document.createElement('div');
                c.className = 'card';
                let html = `<strong>Câu ${q.id}:</strong> ${q.originalSentenceHTML}<br><br>`;
                const uA = st.answer ? escapeHTML(st.answer) : "(Bạn chưa viết câu trả lời)";
                html += `<span>Bài làm của bạn: <br><strong>${uA}</strong></span><br><br>`;
                html += `<span>Đáp án mẫu: <span class="correct-answer-text">${q.sampleAnswers.join(" <strong>HOẶC</strong> ")}</span></span><br><br>`;
                html += `<div class="explanation" style="display:block;">${q.explanationHTML}</div>`;
                c.innerHTML = html;
                elc.appendChild(c);
            }
        });
        
        if (hasGradable && allCorrectGradable) {
            wlc.innerHTML = '<div style="text-align:center; font-size:18px; color:var(--color-correct); font-weight:bold;">Chúc mừng! Bạn đã trả lời đúng tất cả các câu hỏi trắc nghiệm!</div>';
        }
    }

    renderQuiz();
    updateProgress();
})();
</script>
</body>
</html>
