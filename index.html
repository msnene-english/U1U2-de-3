<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-primary: #4F46E5;
    --color-secondary: #06B6D4;
    --color-accent: #F59E0B;
    --color-bg: #F8FAFC;
    --color-card: #FFFFFF;
    --color-correct: #22C55E;
    --color-wrong: #EF4444;
    --color-selecting: #2563EB;
    --color-pending: #FEF3C7;
    --color-pending-text: #92400E;
  }
  body {
    font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    background-color: var(--color-bg);
    margin: 0;
    padding: 20px;
    color: #1E293B;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    color: var(--color-primary);
  }
  .user-info {
    background: var(--color-card);
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 20px;
  }
  .user-info label {
    font-weight: 600;
    display: block;
    margin-bottom: 8px;
  }
  .user-info input {
    width: 100%;
    padding: 10px;
    border: 1px solid #CBD5E1;
    border-radius: 8px;
    font-size: 16px;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
  }
  .card {
    background: var(--color-card);
    border-radius: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    padding: 20px;
    margin-bottom: 24px;
    position: relative;
  }
  .question-text {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.6;
    margin-bottom: 20px;
  }
  .options-container {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .option-btn {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 52px;
    padding: 14px 20px;
    background: #F1F5F9;
    border: 2px solid transparent;
    border-radius: 12px;
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 19px;
    font-weight: 500;
    line-height: 1.6;
    color: #334155;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s ease;
    overflow-wrap: break-word;
    box-sizing: border-box;
  }
  .option-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    border-color: var(--color-selecting);
  }
  .option-btn.pending {
    background: var(--color-pending);
    color: var(--color-pending-text);
    border-color: var(--color-pending);
    transform: scale(1.02);
  }
  .option-btn.correct {
    background: var(--color-correct);
    color: #FFF;
    border-color: var(--color-correct);
  }
  .option-btn.wrong {
    background: var(--color-wrong);
    color: #FFF;
    border-color: var(--color-wrong);
    animation: shake 0.1s ease-in-out 2;
  }
  .option-label {
    font-weight: 700;
    margin-right: 12px;
    flex-shrink: 0;
  }
  .action-btn {
    margin-top: 16px;
    padding: 12px 24px;
    background: var(--color-primary);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    float: right;
    font-family: 'Inter', sans-serif;
    transition: opacity 0.2s;
  }
  .action-btn:disabled {
    background: #94A3B8;
    cursor: not-allowed;
    opacity: 0.7;
  }
  .explanation {
    display: none;
    margin-top: 60px;
    padding: 16px;
    background: #F8FAFC;
    border-left: 4px solid var(--color-primary);
    border-radius: 0 8px 8px 0;
    font-size: 18px;
    line-height: 1.8;
  }
  .explanation-step {
    margin-bottom: 12px;
  }
  .clearfix::after {
    content: "";
    clear: both;
    display: table;
  }
  #submit-btn {
    width: 100%;
    padding: 16px;
    font-size: 18px;
    margin-top: 20px;
    margin-bottom: 40px;
    border-radius: 12px;
    background: var(--color-accent);
  }
  table.summary-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    background: var(--color-card);
  }
  table.summary-table th, table.summary-table td {
    border: 1px solid #E2E8F0;
    text-align: center;
    padding: 8px;
    font-size: 14px;
  }
  .cell-correct { background-color: var(--color-correct); color: #fff; }
  .cell-wrong { background-color: var(--color-wrong); color: #fff; }
  .cell-empty { background-color: var(--color-wrong); color: #fff; }
  .cell-neutral { background-color: #F1F5F9; color: #64748B; }

  @keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    50% { transform: translateX(4px); }
    75% { transform: translateX(-4px); }
    100% { transform: translateX(0); }
  }
  @media (max-width: 600px) {
    h1 { font-size: 20px; }
    .question-text { font-size: 20px; }
    .option-btn { font-size: 17px; }
    .action-btn { font-size: 16px; }
    .explanation { font-size: 16px; }
  }
</style>
</head>

  const userState = {};
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function playTone(frequency, duration, type, volume) {
    try {
      initAudio();
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      oscillator.type = type;
      oscillator.frequency.value = frequency;
      
      gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      
      oscillator.start();
      oscillator.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }

  function playSelectSound() { playTone(600, 0.08, 'sine', 0.15); }
  
  function playCorrectSound() {
    try {
      initAudio();
      playTone(800, 0.1, 'sine', 0.2);
      setTimeout(() => playTone(1200, 0.15, 'sine', 0.2), 100);
    } catch(e) {}
  }
  
  function playWrongSound() { playTone(150, 0.2, 'sawtooth', 0.12); }

  function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      
    }
    return arr;
  }

  function renderQuiz() {
    const container = document.getElementById('quiz-container');
    quizData.forEach(q => {
      userState[q.id] = { selected: null, checked: false, isCorrect: null };
      
      const card = document.createElement('div');
      card.className = 'card';
      card.id = `card-${q.id}`;
      
      let html = `<div class="question-text">${q.id}. ${q.questionHTML}</div>`;
      html += `<div class="options-container" id="options-${q.id}">`;
      
      // Shuffle content and labels independently
      const shuffledOptions = shuffleArray(q.options);
      const labels = ['A', 'B', 'C', 'D'];
      const shuffledLabels = shuffleArray(labels);
      
      shuffledOptions.forEach((opt, index) => {
        const displayLabel = shuffledLabels[index];
        html += `
          <button class="option-btn" 
                  data-qid="${q.id}" 
                  data-original-label="${opt.label}"
                  data-display-label="${displayLabel}"
                  id="opt-${q.id}-${opt.label}">
            <span class="option-label">${displayLabel}.</span> 
            <span class="option-content">${opt.html}</span>
          </button>`;
      });
      
      html += `</div>
        <div class="clearfix">
          <button id="check-btn-${q.id}" class="action-btn" disabled onclick="checkAnswer(${q.id})">Kiểm tra</button>
        </div>
        <div id="explanation-${q.id}" class="explanation">${q.explanationHTML}</div>
      `;
      card.innerHTML = html;
      container.appendChild(card);
    });
    
    // Add event listeners to all option buttons
    document.querySelectorAll('.option-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        initAudio(); // Initialize audio context on first user interaction
        const qid = parseInt(this.getAttribute('data-qid'));
        const origLabel = this.getAttribute('data-original-label');
        
        if (userState[qid].checked) return;
        
        userState[qid].selected = origLabel;
        
        // Update UI for selection
        document.querySelectorAll(`#options-${qid} .option-btn`).forEach(b => b.classList.remove('pending'));
        this.classList.add('pending');
        
        document.getElementById(`check-btn-${qid}`).disabled = false;
        playSelectSound();
      });
    });
  }

  function checkAnswer(qid, isAuto = false) {
    const state = userState[qid];
    if (state.checked) return;
    
    const qData = quizData.find(q => q.id === qid);
    const correctOpt = qData.options.find(o => o.isCorrect).label;
    
    state.checked = true;
    if (state.selected === correctOpt) {
      state.isCorrect = true;
    } else {
      state.isCorrect = false;
    }
    
    // UI Updates
    document.querySelectorAll(`#options-${qid} .option-btn`).forEach(b => {
      b.style.pointerEvents = 'none';
      b.classList.remove('pending');
      const orig = b.getAttribute('data-original-label');
      
      if (orig === correctOpt) {
        b.classList.add('correct');
        b.innerHTML = b.innerHTML.replace('<span class="option-label">', '✓ <span class="option-label">');
      } else if (orig === state.selected && !state.isCorrect) {
        b.classList.add('wrong');
        b.innerHTML = b.innerHTML.replace('<span class="option-label">', '✕ <span class="option-label">');
      }
    });
    
    document.getElementById(`explanation-${qid}`).style.display = 'block';
    const checkBtn = document.getElementById(`check-btn-${qid}`);
    if(checkBtn) {
        checkBtn.disabled = true;
        checkBtn.style.display = 'none';
    }
    
    if (!isAuto) {
      if (state.isCorrect) playCorrectSound();
      else playWrongSound();
    }
  }

  function submitQuiz() {
    const studentName = document.getElementById('studentName').value.trim();
    if (!studentName) {
      alert('Vui lòng nhập tên học sinh trước khi nộp bài!');
      document.getElementById('studentName').focus();
      return;
    }
    
    document.getElementById('submit-btn').disabled = true;
    
    // Check all unanswered/un-checked questions
    quizData.forEach(q => {
      if (!userState[q.id].checked) {
        if (userState[q.id].selected !== null) {
          checkAnswer(q.id, true);
        } else {
          // Not selected anything
          userState[q.id].checked = true;
          userState[q.id].isCorrect = false;
          const correctOpt = q.options.find(o => o.isCorrect).label;
          document.querySelectorAll(`#options-${q.id} .option-btn`).forEach(b => {
            b.style.pointerEvents = 'none';
            if (b.getAttribute('data-original-label') === correctOpt) {
              b.classList.add('correct');
              b.innerHTML = b.innerHTML.replace('<span class="option-label">', '✓ <span class="option-label">');
            }
          });
          document.getElementById(`explanation-${q.id}`).style.display = 'block';
          const checkBtn = document.getElementById(`check-btn-${q.id}`);
          if(checkBtn) {
            checkBtn.style.display = 'none';
          }
        }
      }
    });
    
    // Play single sound for submit
    const correctCount = Object.values(userState).filter(s => s.isCorrect).length;
    const totalCount = quizData.length;
    if (correctCount === totalCount) playCorrectSound();
    else playWrongSound();
    
    // Show results
    document.getElementById('result-section').style.display = 'block';
    document.getElementById('score-text').innerText = `Điểm của bạn: ${correctCount} / ${totalCount}`;
    
    renderSummaryTable();
    sendGoogleForm(studentName, correctCount, totalCount);
    
    document.getElementById('result-section').scrollIntoView({ behavior: 'smooth' });
  }

  function renderSummaryTable() {
    const container = document.getElementById('summary-container');
    let html = '';
    
    const correctCount = Object.values(userState).filter(s => s.isCorrect).length;
    if (correctCount === quizData.length) {
      html += '<h3 style="text-align:center; color: var(--color-correct);">🎉 Chúc mừng bạn đã trả lời đúng 100% các câu hỏi! 🎉</h3>';
    }
    
    const itemsPerRow = 15;
    for (let i = 0; i < quizData.length; i += itemsPerRow) {
      const chunk = quizData.slice(i, i + itemsPerRow);
      
      html += '<table class="summary-table"><tr><th>Câu</th>';
      chunk.forEach(q => { html += `<th>${q.id}</th>`; });
      html += '</tr>';
      
      ['A', 'B', 'C', 'D'].forEach(label => {
        html += `<tr><th>${label}</th>`;
        chunk.forEach(q => {
          const state = userState[q.id];
          const correctOpt = q.options.find(o => o.isCorrect).label;
          let cellClass = 'cell-neutral';
          
          if (state.selected === null) {
            cellClass = 'cell-empty'; // Highlight whole column red if not selected
          } else if (label === correctOpt) {
            cellClass = 'cell-correct';
          } else if (label === state.selected && !state.isCorrect) {
            cellClass = 'cell-wrong';
          }
          
          html += `<td class="${cellClass}">${label}</td>`;
        });
        html += '</tr>';
      });
      html += '</table><br>';
    }
    container.innerHTML = html;
  }

  function sendGoogleForm(studentName, correctCount, totalCount) {
    const score = `${correctCount}/${totalCount}`;
    const percentage = Math.round((correctCount / totalCount) * 100) + '%';
    
    let wrongDetails = [];
    quizData.forEach(q => {
      const state = userState[q.id];
      if (!state.isCorrect) {
        const correctOpt = q.options.find(o => o.isCorrect).label;
        const selected = state.selected || 'Bỏ trống';
        wrongDetails.push(`Câu ${q.id}: Chọn ${selected} (Đúng: ${correctOpt})`);
      }
    });
    const loisai = wrongDetails.length > 0 ? wrongDetails.join(' | ') : 'Không có lỗi sai';
    
    const formUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSelQyzh_lWyb2vZUnQ1jc1p9FLRknDZiUt9NiUiiX1epHTFLw/formResponse';
    
    const formData = new FormData();
    formData.append('entry.351633352', 'U1U2 đề 3');
    formData.append('entry.1895948982', studentName);
    formData.append('entry.1232319784', score);
    formData.append('entry.1125920425', percentage);
    formData.append('entry.1907417670', loisai);
    
    fetch(formUrl, {
      method: 'POST',
      mode: 'no-cors',
      body: formData
    }).catch(console.error);
  }

  document.getElementById('submit-btn').addEventListener('click', submitQuiz);
  
  // Start
  renderQuiz();
</script>
