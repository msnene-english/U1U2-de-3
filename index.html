<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U1-U2 Đề 3</title>
    <style>
        :root{--color-primary:#4F46E5;--color-secondary:#06B6D4;--color-accent:#F59E0B;--color-bg:#F8FAFC;--color-card:#FFFFFF;--color-correct:#22C55E;--color-wrong:#EF4444;--color-selecting:#2563EB;--color-pending:#FEF3C7;--color-pending-text:#92400E;}
        body { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; background-color: var(--color-bg); margin: 0; padding: 0; color: #333; }
        .watermark { position: absolute; top: 10px; left: 10px; font-size: 14px; font-weight: 500; color: #666; }
        .footer-watermark { text-align: center; padding: 20px; font-size: 14px; color: #666; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        
        #start-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: var(--color-bg); position: relative; }
        #start-screen h1 { margin-bottom: 20px; font-size: 24px; text-align: center; }
        #student-name-input { padding: 12px 16px; font-size: 16px; border: 2px solid #cbd5e1; border-radius: 8px; margin-bottom: 20px; width: 300px; max-width: 90%; outline: none; }
        #student-name-input:focus { border-color: var(--color-primary); }
        #start-btn { padding: 14px 32px; font-size: 17px; background-color: var(--color-primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        #start-btn:hover { background-color: #4338ca; }
        
        #quiz-screen { display: none; position: relative; }
        
        .progress-container { margin-bottom: 30px; text-align: center; position: sticky; top: 0; background: var(--color-bg); padding: 15px 0; z-index: 10; border-bottom: 1px solid #e2e8f0; }
        .progress-text { font-weight: 600; font-size: 16px; color: #475569; }
        .progress-bar-bg { width: 100%; height: 8px; background-color: #e2e8f0; border-radius: 4px; overflow: hidden; margin-top: 10px; }
        .progress-bar-fill { height: 100%; background-color: var(--color-primary); width: 0%; transition: width 0.3s ease; }
        
        .card { background: var(--color-card); border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 24px; margin-bottom: 24px; transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.15); }
        
        .question-title { font-size: 16px; font-weight: 500; color: #64748b; margin-bottom: 10px; }
        .question-text { font-size: 21px; font-weight: 600; line-height: 1.6; margin-bottom: 18px; overflow-wrap: break-word; }
        .original-sentence { font-size: 19px; font-weight: 500; margin-bottom: 12px; color: #1e293b; }
        
        .input-gap { padding: 6px 12px; font-size: 19px; border: 2px solid #cbd5e1; border-radius: 6px; width: auto; min-width: 150px; margin: 0 5px; outline: none; transition: all 0.2s; font-family: inherit; font-weight: 500; color: #0f172a; display: inline-block; }
        .input-gap:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2); }
        .input-gap.pending { background-color: var(--color-pending); color: var(--color-pending-text); border-color: var(--color-accent); transform: scale(1.02); }
        .input-gap.correct { background-color: var(--color-correct) !important; color: white !important; border-color: var(--color-correct) !important; }
        .input-gap.wrong { background-color: var(--color-wrong) !important; color: white !important; border-color: var(--color-wrong) !important; animation: shake 0.2s; }
        
        textarea.sentence-rewrite { width: 100%; padding: 16px; font-size: 18px; border: 2px solid #cbd5e1; border-radius: 8px; resize: vertical; min-height: 100px; box-sizing: border-box; font-family: inherit; margin-top: 10px; outline: none; transition: all 0.2s; }
        textarea.sentence-rewrite:focus { border-color: var(--color-primary); }
        textarea.sentence-rewrite.pending { background-color: var(--color-pending); color: var(--color-pending-text); border-color: var(--color-accent); }
        
        .check-btn { padding: 12px 24px; font-size: 17px; font-weight: 600; background-color: var(--color-secondary); color: white; border: none; border-radius: 8px; cursor: pointer; min-height: 48px; margin-top: 20px; transition: opacity 0.2s; }
        .check-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .explanation { display: none; margin-top: 24px; padding: 16px 20px; background-color: #f8fafc; border-left: 4px solid var(--color-primary); border-radius: 0 8px 8px 0; font-size: 17px; line-height: 1.6; color: #334155; }
        
        .correct-answer-inline { color: var(--color-correct); font-weight: 700; margin-left: 8px; font-size: 19px; }
        
        .sample-answer-box { margin-top: 16px; padding: 16px; background-color: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; display: none; }
        .sample-answer-title { font-weight: 600; color: #166534; margin-bottom: 8px; font-size: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
        .sample-answer-content { font-size: 18px; color: #15803d; font-weight: 500; }
        
        #submit-btn { display: block; width: 100%; padding: 18px; font-size: 19px; font-weight: 700; background-color: var(--color-primary); color: white; border: none; border-radius: 12px; cursor: pointer; margin-top: 40px; box-shadow: 0 4px 12px rgba(79,70,229,0.3); transition: transform 0.2s; }
        #submit-btn:hover { transform: translateY(-2px); }
        #submit-btn:disabled { background-color: #94a3b8; cursor: not-allowed; box-shadow: none; transform: none; }
        
        #results-section { display: none; margin-top: 60px; }
        .section-title { font-size: 24px; font-weight: 700; color: #0f172a; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 2px solid #e2e8f0; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-content { background: white; padding: 40px; border-radius: 20px; text-align: center; max-width: 450px; width: 90%; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04); }
        .modal-title { font-size: 24px; font-weight: 700; color: #0f172a; margin-bottom: 16px; }
        .modal-score { font-size: 48px; font-weight: 800; color: var(--color-primary); margin: 20px 0; }
        .modal-text { font-size: 17px; color: #475569; margin-bottom: 24px; line-height: 1.6; }
        .modal-close { padding: 14px 32px; background: var(--color-primary); color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 17px; font-weight: 600; width: 100%; }
        
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
        
        .locked { pointer-events: none; }
    </style>
</head>
<body>

<div id="start-screen">
    <div class="watermark">GV biên soạn: Ms Chí Nên - 0852639652</div>
    <h1>U1-U2 Đề 3</h1>
    <p style="margin-bottom: 20px; color: #64748b; font-size: 16px;">Vui lòng nhập tên của bạn để bắt đầu</p>
    <input type="text" id="student-name-input" placeholder="Nhập họ và tên..." autocomplete="off">
    <button id="start-btn">Bắt đầu làm bài</button>
</div>

<div id="quiz-screen">
    <div class="watermark">GV biên soạn: Ms Chí Nên - 0852639652</div>
    <div class="progress-container">
        <div class="progress-text">Tiến độ (Phần điền từ): <span id="progress-count">0/16</span></div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
    </div>

    <div class="container" id="quiz-container">
        <!-- Quiz content will be injected here -->
    </div>
    
    <div class="container">
        <button id="submit-btn">Nộp bài</button>
        
        <div id="results-section">
            <h2 class="section-title" id="wrong-answers-title">DANH SÁCH CÁC CÂU LÀM SAI</h2>
            <div id="wrong-answers-container"></div>
            
            <h2 class="section-title" style="margin-top: 40px;">Các câu tự luận — hãy tự đối chiếu đáp án mẫu</h2>
            <div id="essay-answers-container"></div>
        </div>
    </div>
    
    <div class="footer-watermark">GV biên soạn: Ms Chí Nên - 0852639652</div>
</div>

<div class="modal-overlay" id="result-modal">
    <div class="modal-content">
        <div class="modal-title">Hoàn thành bài tập!</div>
        <div class="modal-score" id="modal-score-text">0/16</div>
        <div class="modal-text" id="modal-feedback-text"></div>
        <button class="modal-close" id="modal-close-btn">Xem chi tiết</button>
    </div>
</div>

<!-- Hidden iframe to submit to Google Form in background without CORS issues -->
<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted){formSubmitted();}"></iframe>

<script>
const quizData = [
    // WORD FORM (33-48)
    { id: 33, type: 'gap_fill_text', questionHTML: "33. We need to make an {{blank:b1}} with the hotel about our late arrival. (ARRANGE)", blanks: [{ blankId: 'b1', correctAnswers: ['arrangement'] }], explanationHTML: "Dịch: Chúng ta cần sắp xếp với khách sạn về việc đến muộn.<br>Từ gốc: <strong>ARRANGE</strong> (động từ: sắp xếp).<br>Vị trí cần điền đứng sau mạo từ 'an', do đó cần một danh từ. Danh từ của arrange là <strong>arrangement</strong>." },
    { id: 34, type: 'gap_fill_text', questionHTML: "34. The travel agency offers a wide {{blank:b1}} of holiday destinations. (CHOOSE)", blanks: [{ blankId: 'b1', correctAnswers: ['choice', 'selection', 'range'] }], explanationHTML: "Dịch: Đại lý du lịch cung cấp nhiều sự lựa chọn về các điểm đến cho kỳ nghỉ.<br>Từ gốc: <strong>CHOOSE</strong> (động từ: lựa chọn).<br>Cụm từ 'a wide choice/selection/range of' nghĩa là nhiều sự lựa chọn đa dạng. Cần điền danh từ." },
    { id: 35, type: 'gap_fill_text', questionHTML: "35. The local {{blank:b1}} welcomed visitors warmly. (INHABIT)", blanks: [{ blankId: 'b1', correctAnswers: ['inhabitants'] }], explanationHTML: "Dịch: Những cư dân địa phương chào đón du khách một cách nồng nhiệt.<br>Từ gốc: <strong>INHABIT</strong> (động từ: cư trú).<br>Sau tính từ 'local' cần danh từ chỉ người ở số nhiều (vì chào đón du khách) nên dùng <strong>inhabitants</strong>." },
    { id: 36, type: 'gap_fill_text', questionHTML: "36. She is a professional {{blank:b1}} who specialises in travel photography. (PHOTOGRAPH)", blanks: [{ blankId: 'b1', correctAnswers: ['photographer'] }], explanationHTML: "Dịch: Cô ấy là một nhiếp ảnh gia chuyên nghiệp chuyên về nhiếp ảnh du lịch.<br>Từ gốc: <strong>PHOTOGRAPH</strong> (danh từ: bức ảnh / động từ: chụp ảnh).<br>Sau tính từ 'professional' và mệnh đề quan hệ 'who' chỉ người, cần danh từ chỉ người: <strong>photographer</strong>." },
    { id: 37, type: 'gap_fill_text', questionHTML: "37. The two transport systems are completely {{blank:b1}}. (DIFFER)", blanks: [{ blankId: 'b1', correctAnswers: ['different'] }], explanationHTML: "Dịch: Hai hệ thống giao thông thì hoàn toàn khác biệt.<br>Từ gốc: <strong>DIFFER</strong> (động từ: khác nhau).<br>Sau động từ to be 'are' và trạng từ 'completely' cần một tính từ: <strong>different</strong>." },
    { id: 38, type: 'gap_fill_text', questionHTML: "38. Travel can {{blank:b1}} your mind and broaden your horizons. (BROAD)", blanks: [{ blankId: 'b1', correctAnswers: ['broaden'] }], explanationHTML: "Dịch: Du lịch có thể mở rộng tâm trí và mở mang tầm nhìn của bạn.<br>Từ gốc: <strong>BROAD</strong> (tính từ: rộng).<br>Sau động từ khuyết thiếu 'can' cần một động từ nguyên thể (bare infinitive). Động từ của broad là <strong>broaden</strong>." },
    { id: 39, type: 'gap_fill_text', questionHTML: "39. Is there a {{blank:b1}} flight to Madrid, or do we have to change planes? (DIRECT)", blanks: [{ blankId: 'b1', correctAnswers: ['direct'] }], explanationHTML: "Dịch: Có chuyến bay thẳng đến Madrid không, hay chúng ta phải đổi máy bay?<br>Từ gốc: <strong>DIRECT</strong> (tính từ/động từ: trực tiếp, thẳng).<br>Trước danh từ 'flight' cần tính từ, từ này giữ nguyên dạng là <strong>direct</strong> (chuyến bay thẳng)." },
    { id: 40, type: 'gap_fill_text', questionHTML: "40. We were surprised by the {{blank:b1}} diversity of the city. (CULTURE)", blanks: [{ blankId: 'b1', correctAnswers: ['cultural'] }], explanationHTML: "Dịch: Chúng tôi đã ngạc nhiên bởi sự đa dạng văn hóa của thành phố.<br>Từ gốc: <strong>CULTURE</strong> (danh từ: văn hóa).<br>Trước danh từ 'diversity' cần tính từ bổ nghĩa: <strong>cultural</strong> (thuộc về văn hóa)." },
    { id: 41, type: 'gap_fill_text', questionHTML: "41. Our guide was extremely {{blank:b1}} about the history of the castle. (KNOW)", blanks: [{ blankId: 'b1', correctAnswers: ['knowledgeable'] }], explanationHTML: "Dịch: Hướng dẫn viên của chúng tôi cực kỳ am hiểu về lịch sử của lâu đài.<br>Từ gốc: <strong>KNOW</strong> (động từ: biết).<br>Sau động từ to be 'was' và trạng từ 'extremely' cần tính từ chỉ người am hiểu: <strong>knowledgeable</strong>." },
    { id: 42, type: 'gap_fill_text', questionHTML: "42. The new railway is of great {{blank:b1}} to local residents. (IMPORTANT)", blanks: [{ blankId: 'b1', correctAnswers: ['importance'] }], explanationHTML: "Dịch: Tuyến đường sắt mới có tầm quan trọng lớn đối với cư dân địa phương.<br>Từ gốc: <strong>IMPORTANT</strong> (tính từ: quan trọng).<br>Cấu trúc 'be of + (adj) + Noun' (ví dụ: of great importance = rất quan trọng). Cần điền danh từ <strong>importance</strong>." },
    { id: 43, type: 'gap_fill_text', questionHTML: "43. The main {{blank:b1}} to the park is on the east side. (ENTER)", blanks: [{ blankId: 'b1', correctAnswers: ['entrance'] }], explanationHTML: "Dịch: Lối vào chính của công viên nằm ở phía đông.<br>Từ gốc: <strong>ENTER</strong> (động từ: đi vào).<br>Sau mạo từ 'The' và tính từ 'main' cần danh từ. Danh từ của enter là <strong>entrance</strong> (lối vào)." },
    { id: 44, type: 'gap_fill_text', questionHTML: "44. After the renovation, the old station was almost {{blank:b1}}. (RECOGNISE)", blanks: [{ blankId: 'b1', correctAnswers: ['unrecognisable', 'unrecognizable'] }], explanationHTML: "Dịch: Sau khi cải tạo, nhà ga cũ gần như không thể nhận ra.<br>Từ gốc: <strong>RECOGNISE</strong> (động từ: nhận ra).<br>Cần tính từ mang nghĩa phủ định (vì thay đổi quá nhiều khiến không nhận ra được nữa): <strong>unrecognisable</strong> (hoặc unrecognizable)." },
    { id: 45, type: 'gap_fill_text', questionHTML: "45. The {{blank:b1}} gives details of all train departures. (TIME)", blanks: [{ blankId: 'b1', correctAnswers: ['timetable'] }], explanationHTML: "Dịch: Lịch trình cung cấp chi tiết về tất cả các chuyến tàu khởi hành.<br>Từ gốc: <strong>TIME</strong> (danh từ: thời gian).<br>Từ vựng chỉ bảng giờ tàu/xe, lịch trình là danh từ ghép <strong>timetable</strong>." },
    { id: 46, type: 'gap_fill_text', questionHTML: "46. The airline is {{blank:b1}} improving its safety procedures. (CONTINUE)", blanks: [{ blankId: 'b1', correctAnswers: ['continually', 'continuously'] }], explanationHTML: "Dịch: Hãng hàng không đang liên tục cải thiện các quy trình an toàn của mình.<br>Từ gốc: <strong>CONTINUE</strong> (động từ: tiếp tục).<br>Đứng giữa trợ động từ 'is' và động từ chính 'improving' (thì HTTD) cần trạng từ bổ nghĩa cho động từ: <strong>continually</strong> hoặc <strong>continuously</strong>." },
    { id: 47, type: 'gap_fill_text', questionHTML: "47. The trip was so special that it became a very {{blank:b1}} experience. (MEMORY)", blanks: [{ blankId: 'b1', correctAnswers: ['memorable'] }], explanationHTML: "Dịch: Chuyến đi quá đặc biệt đến nỗi nó trở thành một trải nghiệm rất đáng nhớ.<br>Từ gốc: <strong>MEMORY</strong> (danh từ: trí nhớ, kỷ niệm).<br>Trước danh từ 'experience' cần tính từ. Tính từ của memory là <strong>memorable</strong> (đáng nhớ)." },
    { id: 48, type: 'gap_fill_text', questionHTML: "48. The insurance policy provides worldwide travel {{blank:b1}}. (COVER)", blanks: [{ blankId: 'b1', correctAnswers: ['coverage'] }], explanationHTML: "Dịch: Hợp đồng bảo hiểm cung cấp phạm vi bảo hiểm du lịch trên toàn thế giới.<br>Từ gốc: <strong>COVER</strong> (động từ/danh từ: bao phủ, vỏ bọc).<br>Từ vựng dùng trong ngữ cảnh bảo hiểm (sự bảo hiểm, phạm vi bảo hiểm) là danh từ <strong>coverage</strong>." },
    
    // SENTENCE REWRITE (49-64)
    { id: 49, type: 'sentence_rewrite', originalSentenceHTML: "49. We started our journey very early in the morning. (SET)", questionHTML: "→ We ______________________________ very early in the morning.", sampleAnswers: ["We set off very early in the morning."], explanationHTML: "Dịch: Chúng tôi bắt đầu hành trình rất sớm vào buổi sáng.<br>Cấu trúc: <strong>set off</strong> (phrasal verb) mang nghĩa khởi hành, bắt đầu một chuyến đi, tương đương với 'start a journey'." },
    { id: 50, type: 'sentence_rewrite', originalSentenceHTML: "50. Could you collect me at the airport at 8 p.m.? (PICK)", questionHTML: "→ Could you ______________________________ at the airport at 8 p.m.?", sampleAnswers: ["Could you pick me up at the airport at 8 p.m.?"], explanationHTML: "Dịch: Bạn có thể đón tôi tại sân bay lúc 8 giờ tối không?<br>Cấu trúc: <strong>pick someone up</strong> nghĩa là đón ai đó, tương đương 'collect someone'." },
    { id: 51, type: 'sentence_rewrite', originalSentenceHTML: "51. We went to the station to say goodbye to our friends. (SEE)", questionHTML: "→ We went to the station to ______________________________.", sampleAnswers: ["We went to the station to see our friends off."], explanationHTML: "Dịch: Chúng tôi đến nhà ga để tiễn bạn bè.<br>Cấu trúc: <strong>see someone off</strong> nghĩa là tiễn ai đó, tương đương 'say goodbye to someone'." },
    { id: 52, type: 'sentence_rewrite', originalSentenceHTML: "52. The driver stopped beside the road. (PULL)", questionHTML: "→ The driver ______________________________ beside the road.", sampleAnswers: ["The driver pulled in beside the road."], explanationHTML: "Dịch: Tài xế đã dừng xe bên lề đường.<br>Cấu trúc: <strong>pull in</strong> nghĩa là tấp xe vào lề, dừng xe, tương đương 'stop'." },
    { id: 53, type: 'sentence_rewrite', originalSentenceHTML: "53. We returned home after a week abroad. (BACK)", questionHTML: "→ We ______________________________ after a week abroad.", sampleAnswers: ["We got back after a week abroad."], explanationHTML: "Dịch: Chúng tôi đã trở về nhà sau một tuần ở nước ngoài.<br>Cấu trúc: <strong>get back</strong> nghĩa là quay trở về, tương đương 'return'." },
    { id: 54, type: 'sentence_rewrite', originalSentenceHTML: "54. The bus stopped to let the passengers get out. (DROP)", questionHTML: "→ The bus stopped to ______________________________.", sampleAnswers: ["The bus stopped to drop the passengers off."], explanationHTML: "Dịch: Xe buýt dừng lại để cho hành khách xuống.<br>Cấu trúc: <strong>drop someone off</strong> nghĩa là cho ai xuống xe, tương đương 'let someone get out'." },
    { id: 55, type: 'sentence_rewrite', originalSentenceHTML: "55. We are going towards the airport now. (MAKING)", questionHTML: "→ We are ______________________________ the airport now.", sampleAnswers: ["We are making for the airport now."], explanationHTML: "Dịch: Chúng tôi đang hướng về phía sân bay bây giờ.<br>Cấu trúc: <strong>make for</strong> nghĩa là đi về hướng nào đó, tiến tới, tương đương 'go towards'." },
    { id: 56, type: 'sentence_rewrite', originalSentenceHTML: "56. We need to register at the hotel before 2 p.m. (CHECK)", questionHTML: "→ We need to ______________________________ before 2 p.m.", sampleAnswers: ["We need to check in before 2 p.m."], explanationHTML: "Dịch: Chúng tôi cần làm thủ tục nhận phòng khách sạn trước 2 giờ chiều.<br>Cấu trúc: <strong>check in</strong> nghĩa là đăng ký, làm thủ tục nhận phòng, tương đương 'register at a hotel'." },

let userState = {};
let totalGapFill = 0;
let answeredGapFill = 0;
let studentName = "";
let audioCtx = null;
let submitted = false;

function initAudio() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch (e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') { audioCtx.resume(); }
}

function playTone(type, freq, duration, vol) {
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}

function playInputSound() { playTone('sine', 600, 0.08, 0.15); }
function playCorrectSound() { 
    if(!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
    } catch(e) {}
}
function playWrongSound() { playTone('sawtooth', 150, 0.2, 0.12); }
function playSubmitSound() { playTone('triangle', 500, 0.12, 0.15); }

function escapeHTML(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
}

function normalizeAnswer(str) {
    if(!str) return "";
    return str.trim().replace(/\s+/g, ' ').toLowerCase();
}

(function() {
    quizData.forEach(q => {
        if (q.type === 'gap_fill_text') {
            totalGapFill++;
            userState[q.id] = { answer: {}, checked: false, isCorrect: null, blankResults: {} };
            q.blanks.forEach(b => userState[q.id].answer[b.blankId] = "");
        } else if (q.type === 'sentence_rewrite') {
            userState[q.id] = { answer: "", checked: false, isCorrect: null };
        }
    });

    const startBtn = document.getElementById('start-btn');
    const nameInput = document.getElementById('student-name-input');
    
    startBtn.addEventListener('click', () => {
        const name = nameInput.value.trim();
        if (!name) {
            alert("Vui lòng nhập tên của bạn để bắt đầu làm bài!");
            nameInput.focus();
            return;
        }
        studentName = name;
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        initAudio();
        renderQuiz();
        updateProgress();
    });

    nameInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') startBtn.click();
    });

    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';
        
        quizData.forEach(q => {
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `card-${q.id}`;
            
            if (q.type === 'gap_fill_text') {
                let html = `<div class="question-title">Phần Điền từ (Word Form)</div>`;
                let qHtml = q.questionHTML;
                q.blanks.forEach(b => {
                    qHtml = qHtml.replace(`{{blank:${b.blankId}}}`, `<input type="text" class="input-gap" data-qid="${q.id}" data-bid="${b.blankId}" autocomplete="off">`);
                });
                html += `<div class="question-text">${qHtml}</div>`;
                html += `<button class="check-btn" id="check-btn-${q.id}" disabled>Kiểm tra</button>`;
                html += `<span class="correct-answer-inline" id="correct-ans-${q.id}"></span>`;
                html += `<div class="explanation" id="exp-${q.id}">${q.explanationHTML}</div>`;
                card.innerHTML = html;
                container.appendChild(card);
                
                const inputs = card.querySelectorAll('.input-gap');
                inputs.forEach(input => {
                    let hasPlayedSound = false;
                    input.addEventListener('input', (e) => {
                        const val = e.target.value;
                        userState[q.id].answer[e.target.dataset.bid] = val;
                        
                        if (val.trim()) {
                            e.target.classList.add('pending');
                            if (!hasPlayedSound) {
                                initAudio();
                                playInputSound();
                                hasPlayedSound = true;
                            }
                        } else {
                            e.target.classList.remove('pending');
                            hasPlayedSound = false;
                        }
                        
                        updateCheckBtn(q.id);
                        updateProgress();
                    });
                });
                
                card.querySelector(`#check-btn-${q.id}`).addEventListener('click', () => {
                    checkGapFill(q.id);
                });
                
            } else if (q.type === 'sentence_rewrite') {
                let html = `<div class="question-title">Phần Viết lại câu (Không tính vào điểm)</div>`;
                html += `<div class="original-sentence">${q.originalSentenceHTML}</div>`;
                html += `<div class="question-text">${q.questionHTML}</div>`;
                html += `<textarea class="sentence-rewrite" data-qid="${q.id}" placeholder="Nhập câu trả lời của bạn vào đây..."></textarea>`;
                html += `<button class="check-btn" id="check-btn-${q.id}" disabled>Xong / Lưu tạm</button>`;
                html += `<div class="sample-answer-box" id="sample-${q.id}">
                            <div class="sample-answer-title">Đáp án mẫu:</div>
                            <div class="sample-answer-content">${q.sampleAnswers.join("<br>")}</div>
                         </div>`;
                html += `<div class="explanation" id="exp-${q.id}">${q.explanationHTML}</div>`;
                card.innerHTML = html;
                container.appendChild(card);
                
                const textarea = card.querySelector('textarea');
                let hasPlayedSound = false;
                textarea.addEventListener('input', (e) => {
                    const val = e.target.value;
                    userState[q.id].answer = val;
                    if (val.trim()) {
                        e.target.classList.add('pending');
                        if (!hasPlayedSound) {
                            initAudio();
                            playInputSound();
                            hasPlayedSound = true;
                        }
                    } else {
                        e.target.classList.remove('pending');
                        hasPlayedSound = false;
                    }
                    updateCheckBtn(q.id);
                });
                
                card.querySelector(`#check-btn-${q.id}`).addEventListener('click', () => {
                    checkSentenceRewrite(q.id);
                });
            }
        });
        
        document.getElementById('submit-btn').addEventListener('click', submitQuiz);
    }

    function updateCheckBtn(qid) {
        const q = quizData.find(x => x.id === qid);
        const btn = document.getElementById(`check-btn-${qid}`);
        if (userState[qid].checked) return;
        
        if (q.type === 'gap_fill_text') {
            let hasInput = false;
            let allFilled = true;
            q.blanks.forEach(b => {
                const val = userState[qid].answer[b.blankId];
                if (val && val.trim()) hasInput = true;
                else allFilled = false;
            });
            btn.disabled = !hasInput;
        } else if (q.type === 'sentence_rewrite') {
            btn.disabled = !userState[qid].answer.trim();
        }
    }

    function updateProgress() {
        let count = 0;
        quizData.forEach(q => {
            if (q.type === 'gap_fill_text') {
                let hasInput = false;
                q.blanks.forEach(b => {
                    if (userState[q.id].answer[b.blankId] && userState[q.id].answer[b.blankId].trim()) {
                        hasInput = true;
                    }
                });
                if (hasInput) count++;
            }
        });
        answeredGapFill = count;
        document.getElementById('progress-count').textContent = `${count}/${totalGapFill}`;
        document.getElementById('progress-fill').style.width = `${(count/totalGapFill)*100}%`;
    }

    function checkGapFill(qid) {
        const q = quizData.find(x => x.id === qid);
        const state = userState[qid];
        if (state.checked) return;
        
        let allFilled = true;
        q.blanks.forEach(b => {
            if (!state.answer[b.blankId] || !state.answer[b.blankId].trim()) allFilled = false;
        });
        if (!allFilled) {
            alert("Vui lòng điền đủ tất cả các ô trống trước khi kiểm tra!");
            return;
        }

        initAudio();
        state.checked = true;
        let allCorrect = true;
        
        q.blanks.forEach(b => {
            const inputEl = document.querySelector(`input[data-qid="${qid}"][data-bid="${b.blankId}"]`);
            inputEl.classList.remove('pending');
            inputEl.classList.add('locked');
            inputEl.readOnly = true;
            
            const normAns = normalizeAnswer(state.answer[b.blankId]);
            let isCorrect = false;
            b.correctAnswers.forEach(ca => {
                if (normAns === normalizeAnswer(ca)) isCorrect = true;
            });
            
            state.blankResults[b.blankId] = isCorrect;
            if (!isCorrect) allCorrect = false;
            
            if (isCorrect) {
                inputEl.classList.add('correct');
            } else {
                inputEl.classList.add('wrong');
            }
        });
        
        state.isCorrect = allCorrect;
        
        if (allCorrect) playCorrectSound();
        else playWrongSound();
        
        if (!allCorrect) {
            let correctTexts = [];
            q.blanks.forEach(b => {
                correctTexts.push(b.correctAnswers[0]);
            });
            const ansEl = document.getElementById(`correct-ans-${qid}`);
            ansEl.textContent = correctTexts.join(' / ');
            ansEl.style.display = 'inline-block';
        }
        
        document.getElementById(`exp-${qid}`).style.display = 'block';
        const btn = document.getElementById(`check-btn-${qid}`);
        btn.disabled = true;
        btn.textContent = "Đã kiểm tra";
    }

    function checkSentenceRewrite(qid) {
        const state = userState[qid];
        if (state.checked) return;
        
        if (!state.answer.trim()) {
            alert("Vui lòng nhập câu trả lời!");
            return;
        }
        
        state.checked = true;
        state.isCorrect = null;
        
        const textarea = document.querySelector(`textarea[data-qid="${qid}"]`);
        textarea.classList.remove('pending');
        textarea.classList.add('locked');
        textarea.readOnly = true;
        
        document.getElementById(`sample-${qid}`).style.display = 'block';
        document.getElementById(`exp-${qid}`).style.display = 'block';
        
        const btn = document.getElementById(`check-btn-${qid}`);
        btn.disabled = true;
        btn.textContent = "Đã lưu";
    }

    window.formSubmitted = function() {
        // Form submitted callback
    }

    function submitQuiz() {
        if (submitted) return;
        
        quizData.forEach(q => {
            const state = userState[q.id];
            if (!state.checked) {
                if (q.type === 'gap_fill_text') {
                    state.checked = true;
                    let allCorrect = true;
                    q.blanks.forEach(b => {
                        const inputEl = document.querySelector(`input[data-qid="${q.id}"][data-bid="${b.blankId}"]`);
                        inputEl.classList.remove('pending');
                        inputEl.classList.add('locked');
                        inputEl.readOnly = true;
                        
                        const val = state.answer[b.blankId];
                        const normAns = normalizeAnswer(val);
                        let isCorrect = false;
                        if (normAns) {
                            b.correctAnswers.forEach(ca => {
                                if (normAns === normalizeAnswer(ca)) isCorrect = true;
                            });
                        }
                        state.blankResults[b.blankId] = isCorrect;
                        if (!isCorrect) allCorrect = false;
                        
                        if (isCorrect && normAns) {
                            inputEl.classList.add('correct');
                        } else if (normAns) {
                            inputEl.classList.add('wrong');
                        }
                    });
                    state.isCorrect = allCorrect;
                    
                    if (!allCorrect) {
                        let correctTexts = [];
                        q.blanks.forEach(b => correctTexts.push(b.correctAnswers[0]));
                        const ansEl = document.getElementById(`correct-ans-${q.id}`);
                        ansEl.textContent = correctTexts.join(' / ');
                        ansEl.style.display = 'inline-block';
                    }
                    document.getElementById(`exp-${q.id}`).style.display = 'block';
                    document.getElementById(`check-btn-${q.id}`).disabled = true;
                    
                } else if (q.type === 'sentence_rewrite') {
                    state.checked = true;
                    state.isCorrect = null;
                    const textarea = document.querySelector(`textarea[data-qid="${q.id}"]`);
                    textarea.classList.remove('pending');
                    textarea.classList.add('locked');
                    textarea.readOnly = true;
                    document.getElementById(`sample-${q.id}`).style.display = 'block';
                    document.getElementById(`exp-${q.id}`).style.display = 'block';
                    document.getElementById(`check-btn-${q.id}`).disabled = true;
                }
            }
        });
        
        let correctCount = 0;
        let errors = [];
        
        quizData.forEach(q => {
            const state = userState[q.id];
            if (q.type === 'gap_fill_text') {
                if (state.isCorrect) {
                    correctCount++;
                } else {
                    let ansArr = [];
                    let corrArr = [];
                    q.blanks.forEach(b => {
                        let userAns = state.answer[b.blankId];
                        ansArr.push(userAns ? userAns : "(trống)");
                        corrArr.push(b.correctAnswers[0]);
                    });
                    errors.push(`Câu ${q.id}: Học sinh điền ${ansArr.join(', ')} (sai), đáp án đúng là ${corrArr.join(', ')}`);
                }
            }
        });
        
        let scoreStr = `${correctCount}/${totalGapFill}`;
        
        const formUrl = "https://docs.google.com/forms/d/e/1FAIpQLSfZCAK2lpNE8O8Ieqwc3SI1ubr6HZDvGZR91AsSpUk8kEBqaA/formResponse";
        const form = document.createElement('form');
        form.action = formUrl;
        form.method = "POST";
        form.target = "hidden_iframe";
        
        const data = {
            'entry.1861648410': studentName,
            'entry.1691800437': correctCount.toString(),
            'entry.639295732': errors.join("\n"),
            'entry.370465671': "U1-U2 Đề 3"
        };
        
        for (let key in data) {
            let input = document.createElement('input');
            input.type = 'hidden';
            input.name = key;
            input.value = data[key];
            form.appendChild(input);
        }
        
        document.body.appendChild(form);
        form.submit();
        submitted = true;
        
        initAudio();
        if (correctCount === totalGapFill && totalGapFill > 0) {
            playCorrectSound();
        } else {
            playSubmitSound();
        }
        
        document.getElementById('submit-btn').disabled = true;
        document.getElementById('submit-btn').textContent = "Đã nộp bài";
        
        document.getElementById('modal-score-text').textContent = scoreStr;
        let msg = correctCount === totalGapFill ? "Tuyệt vời! Bạn đã trả lời đúng tất cả các câu trắc nghiệm." : "Hãy xem lại các câu làm sai bên dưới nhé.";
        msg += "<br>Bạn đã hoàn thành " + quizData.filter(q=>q.type==='sentence_rewrite' && userState[q.id].answer.trim()).length + "/16 câu trả lời tự do.";
        
        document.getElementById('modal-feedback-text').innerHTML = msg;
        document.getElementById('result-modal').style.display = 'flex';
        
        renderResultsSection();
    }
    
    document.getElementById('modal-close-btn').addEventListener('click', () => {
        document.getElementById('result-modal').style.display = 'none';
        document.getElementById('results-section').style.display = 'block';
        window.scrollTo({
            top: document.getElementById('results-section').offsetTop - 20,
            behavior: 'smooth'
        });
    });

    function renderResultsSection() {
        const wrongContainer = document.getElementById('wrong-answers-container');
        const essayContainer = document.getElementById('essay-answers-container');
        wrongContainer.innerHTML = '';
        essayContainer.innerHTML = '';
        
        let hasWrong = false;
        
        quizData.forEach(q => {
            const state = userState[q.id];
            
            if (q.type === 'gap_fill_text' && state.isCorrect === false) {
                hasWrong = true;
                const card = document.createElement('div');
                card.className = 'card';
                
                let qHtml = q.questionHTML;
                q.blanks.forEach(b => {
                    let userVal = state.answer[b.blankId];
                    let isC = state.blankResults[b.blankId];
                    let ca = b.correctAnswers[0];
                    let htmlRep = "";
                    
                    if (isC) {
                        htmlRep = `<span style="color:var(--color-correct); font-weight:bold;">${escapeHTML(userVal)}</span>`;
                    } else if (userVal && userVal.trim()) {
                        htmlRep = `<span style="color:var(--color-wrong); text-decoration:line-through; font-weight:bold; margin-right:8px;">${escapeHTML(userVal)}</span><span style="color:var(--color-correct); font-weight:bold;">${escapeHTML(ca)}</span>`;
                    } else {
                        htmlRep = `<span style="color:var(--color-correct); font-weight:bold; margin-right:8px;">${escapeHTML(ca)}</span><span style="color:#64748b; font-style:italic; font-size: 15px;">(Bạn chưa điền)</span>`;
                    }
                    qHtml = qHtml.replace(`{{blank:${b.blankId}}}`, htmlRep);
                });
                
                card.innerHTML = `<div class="question-text">${qHtml}</div><div class="explanation" style="display:block;">${q.explanationHTML}</div>`;
                wrongContainer.appendChild(card);
            }
            
            if (q.type === 'sentence_rewrite') {
                const card = document.createElement('div');
                card.className = 'card';
                
                let userVal = state.answer ? state.answer.trim() : "";
                let displayAns = userVal ? `<div style="font-size: 19px; padding: 12px; background: #f1f5f9; border-radius: 8px; margin: 10px 0; font-family: monospace;">${escapeHTML(userVal)}</div>` : `<div style="font-size: 16px; color: #64748b; font-style: italic; margin: 10px 0;">(Bạn chưa viết câu trả lời)</div>`;
                
                card.innerHTML = `
                    <div class="original-sentence">${q.originalSentenceHTML}</div>
                    <div class="question-text" style="font-size:18px; margin-bottom:8px;">${q.questionHTML}</div>
                    ${displayAns}
                    <div class="sample-answer-box" style="display:block;">
                        <div class="sample-answer-title">Đáp án mẫu:</div>
                        <div class="sample-answer-content">${q.sampleAnswers.join("<br>")}</div>
                    </div>
                    <div class="explanation" style="display:block;">${q.explanationHTML}</div>
                `;
                essayContainer.appendChild(card);
            }
        });
        
        if (!hasWrong) {
            wrongContainer.innerHTML = `<div style="padding: 20px; background: #f0fdf4; color: #166534; font-weight: 600; border-radius: 8px; text-align: center; font-size: 18px;">🎉 Chúc mừng! Bạn đã trả lời đúng tất cả các câu hỏi trắc nghiệm!</div>`;
        }
    }
})();
</script>
